spring:
  application:
    name: ai-service
  data:
    mongodb:
      uri: mongodb+srv://root:qu0M7TNa9tflMAwM@cluster0.qkkvbxu.mongodb.net/ai-recommendation-fitness?retryWrites=true&w=majority&appName=Cluster0
      database: ai-recommendation-fitness
  jackson: # this is used to not include null values in JSON responses
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: activity-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.value.default.type: com.fitness.aiservice.model.Activity
        spring.json.use.type.headers: false

kafka:
  topic:
    name: activity-events

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8083
